<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
#app{position:fixed;inset:0;overflow:hidden;background:
 radial-gradient(1100px 750px at 85% -10%,rgba(70,64,160,.20),transparent 62%),
 radial-gradient(950px 700px at 8% 108%,rgba(16,96,118,.17),transparent 62%),
 radial-gradient(700px 500px at 55% 55%,rgba(40,36,90,.10),transparent 65%),#000}
#app::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;background:radial-gradient(120% 90% at 50% 45%,transparent 58%,rgba(0,0,0,.48) 100%)}
#stars{position:absolute;inset:-50%;pointer-events:none;background-image:
 radial-gradient(1.5px 1.5px at 20px 30px,#fff 50%,transparent 51%),
 radial-gradient(1px 1px at 130px 90px,rgba(255,255,255,.8) 50%,transparent 51%),
 radial-gradient(1.2px 1.2px at 70px 160px,rgba(255,255,255,.6) 50%,transparent 51%),
 radial-gradient(1px 1px at 190px 200px,rgba(255,255,255,.9) 50%,transparent 51%),
 radial-gradient(1.6px 1.6px at 240px 60px,rgba(255,255,255,.7) 50%,transparent 51%),
 radial-gradient(1px 1px at 300px 140px,rgba(255,255,255,.5) 50%,transparent 51%);
 background-size:340px 260px;opacity:.6}
#viewport{position:absolute;inset:0;touch-action:none;overflow:hidden;z-index:0}
#world{position:absolute;left:0;top:0;width:10px;height:10px;transform-origin:0 0}
svg#edges{position:absolute;left:0;top:0;width:10px;height:10px;overflow:visible;pointer-events:none}
svg#edges path{fill:none;stroke-linecap:round}
svg#edges path.edge-glow{stroke-width:8;opacity:.10;pointer-events:stroke}
svg#edges path.edge-main{stroke-width:2.6;opacity:.82;pointer-events:stroke}
svg#edges path.flow{stroke:rgba(255,255,255,.55);stroke-width:3;stroke-dasharray:.1 15.9;pointer-events:none;animation:flowmove 1.5s linear infinite}
@keyframes flowmove{to{stroke-dashoffset:-16}}
svg#edges path.temp{stroke:rgba(255,211,77,.85);stroke-width:2.4;stroke-dasharray:6 6;pointer-events:none}
svg#edges path.dim{opacity:.07}
svg#edges path.flow.dim{display:none}
svg#edges path.edge-main.active{stroke-width:4;opacity:1}
svg#edges path.edge-glow.active{stroke-width:11;opacity:.28}
svg#edges path.flow.active{stroke:rgba(255,255,255,.92);stroke-width:3.6;animation-duration:.65s}
.node{position:absolute;width:208px;box-sizing:border-box;padding:13px 15px;border-radius:16px;border:2.5px solid #e8e8e8;background:linear-gradient(180deg,rgba(30,32,46,.97),rgba(12,13,21,.97));color:#fff;font-size:15px;line-height:1.5;white-space:pre-wrap;word-break:break-word;transform:translate(-50%,-50%);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 6px 24px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.09);transition:opacity .18s ease}
.node[data-kind="origin"]{border-color:#ffd34d;box-shadow:0 0 22px rgba(255,211,77,.38),0 6px 24px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.09)}
.node[data-kind="goal"]{border-color:#54d8ff;box-shadow:0 0 22px rgba(84,216,255,.34),0 6px 24px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.09)}
.node[data-kind="merge"]{border-color:#3ddc84;box-shadow:0 0 22px rgba(61,220,132,.34),0 6px 24px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.09)}
.node[data-kind="red"]{border-color:#ff5f57;box-shadow:0 0 22px rgba(255,95,87,.36),0 6px 24px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.09)}
.node[data-kind="violet"]{border-color:#a78bfa;box-shadow:0 0 22px rgba(167,139,250,.36),0 6px 24px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.09)}
.node[data-kind="pink"]{border-color:#ff6ee7;box-shadow:0 0 22px rgba(255,110,231,.34),0 6px 24px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.09)}
.node[data-kind="blue"]{border-color:#4f7cff;box-shadow:0 0 22px rgba(79,124,255,.38),0 6px 24px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.09)}
.node.dim{opacity:.38}
.node.neighbor{outline:1.5px solid rgba(255,255,255,.45);outline-offset:3px}
.node.imgnode{width:208px;padding:6px}
.node.imgnode img{width:100%;display:block;border-radius:9px;pointer-events:none}
.node .caption{font-size:12.5px;color:rgba(255,255,255,.78);padding:6px 4px 2px;line-height:1.35;white-space:pre-wrap;word-break:break-word}
.node.selected{outline:2px solid rgba(255,255,255,.85);outline-offset:3px}
.node.candidate{outline:2px dashed #3ddc84;outline-offset:4px}
.node.dragging{cursor:grabbing;opacity:.92;z-index:5}
.port{position:absolute;right:-9px;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:#ffd34d;box-shadow:0 0 12px 3px rgba(255,211,77,.75);display:none;touch-action:none;cursor:crosshair;z-index:6}
.node.selected .port{display:block}
#topbar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;z-index:20;display:flex;gap:8px;align-items:center}
#tidyBtn,#undoBtn{background:rgba(18,19,28,.78);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:9px 14px;font-size:13.5px;font-weight:600;backdrop-filter:blur(10px);box-shadow:0 4px 18px rgba(0,0,0,.45);cursor:pointer}
#undoBtn{border-color:rgba(255,211,77,.55);color:#ffd34d}
#worldBtn{background:rgba(18,19,28,.78);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:9px 17px;font-size:15px;font-weight:600;letter-spacing:.02em;backdrop-filter:blur(10px);box-shadow:0 4px 18px rgba(0,0,0,.45)}
#worldBtn .wcount{color:rgba(255,255,255,.5);font-weight:400;font-size:13px;margin-left:6px}
#mergeBar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 56px);left:50%;transform:translateX(-50%);z-index:21;background:rgba(20,40,28,.92);border:1px solid #3ddc84;color:#c9ffe0;border-radius:999px;padding:7px 15px;font-size:13px;display:none;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
#edgeBar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 56px);left:50%;transform:translateX(-50%);z-index:21;background:rgba(22,23,33,.92);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:6px 8px 6px 15px;font-size:12.5px;display:none;align-items:center;gap:10px;max-width:94vw;backdrop-filter:blur(8px);box-shadow:0 6px 22px rgba(0,0,0,.5)}
#edgeBarText{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#edgeBarText .arr{color:rgba(255,255,255,.55);margin:0 5px}
#edgeDelBtn{background:rgba(255,90,90,.16);border:1px solid rgba(255,120,120,.55);color:#ffb3b3;border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;white-space:nowrap}
#sheetWrap{position:fixed;inset:0;z-index:50;display:none}
#sheetBg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
#sheet{position:absolute;left:0;right:0;bottom:0;background:#14151d;border-radius:20px 20px 0 0;padding:8px 18px calc(env(safe-area-inset-bottom,0px) + 18px);box-shadow:0 -6px 30px rgba(0,0,0,.7)}
#handle{width:44px;height:22px;border-radius:3px;margin:0 auto 4px;touch-action:none;position:relative}
#handle::after{content:"";position:absolute;left:50%;top:8px;width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.35);transform:translateX(-50%)}
#sheetText{width:100%;min-height:74px;max-height:32vh;background:transparent;border:none;outline:none;color:#fff;font-size:17px;line-height:1.5;resize:none;font-family:inherit;touch-action:auto;-webkit-user-select:text;user-select:text}
#colorRow{display:flex;gap:14px;align-items:center;margin-top:8px;flex-wrap:wrap}
.cdot{width:30px;height:30px;border-radius:50%;border:2.5px solid #e8e8e8;background:transparent;padding:0;cursor:pointer}
.cdot[data-kind="origin"]{border-color:#ffd34d;background:rgba(255,211,77,.25)}
.cdot[data-kind="goal"]{border-color:#54d8ff;background:rgba(84,216,255,.22)}
.cdot[data-kind="merge"]{border-color:#3ddc84;background:rgba(61,220,132,.22)}
.cdot[data-kind="red"]{border-color:#ff5f57;background:rgba(255,95,87,.25)}
.cdot[data-kind="violet"]{border-color:#a78bfa;background:rgba(167,139,250,.25)}
.cdot[data-kind="pink"]{border-color:#ff6ee7;background:rgba(255,110,231,.22)}
.cdot[data-kind="blue"]{border-color:#4f7cff;background:rgba(79,124,255,.25)}
.cdot.on{box-shadow:0 0 0 2.5px #fff;transform:scale(1.18)}
#delBtn{margin-left:auto;background:none;border:none;color:rgba(255,120,120,.9);font-size:20px;padding:4px 6px;cursor:pointer}
#photoBtn{background:none;border:none;font-size:22px;padding:4px 6px;cursor:pointer;line-height:1}
#sheetImgWrap{position:relative;display:none;margin:2px 0 10px}
#sheetImgPreview{width:100%;max-height:30vh;object-fit:contain;display:block;border-radius:12px;background:#000}
#sheetImgDel{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:none;background:rgba(0,0,0,.65);color:#fff;font-size:14px;cursor:pointer;line-height:1}
#worldSheet{position:fixed;inset:0;z-index:60;display:none}
#worldSheetBg{position:absolute;inset:0;background:rgba(0,0,0,.5)}
#worldPanel{position:absolute;left:0;right:0;bottom:0;background:#14151d;border-radius:20px 20px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom,0px) + 20px);max-height:70vh;overflow:auto}
.wrow{display:flex;align-items:center;gap:10px;padding:13px 4px;border-bottom:1px solid rgba(255,255,255,.08);font-size:16px;cursor:pointer}
.wrow .cnt{margin-left:auto;color:rgba(255,255,255,.45);font-size:13px}
.wrow .wact{background:none;border:none;color:rgba(255,255,255,.55);font-size:16px;padding:4px}
#newWorld{width:100%;margin-top:14px;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:12px;font-size:15px}
#viewer{position:fixed;inset:0;z-index:70;background:#000;display:none;touch-action:none;overflow:hidden}
#viewerImg{position:absolute;left:50%;top:50%;max-width:100vw;max-height:100vh;object-fit:contain;transform:translate(-50%,-50%);user-select:none;-webkit-user-select:none;pointer-events:none}
#viewerEdit{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);transform:translateX(-50%);background:rgba(24,24,32,.85);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:11px 26px;font-size:15.5px;backdrop-filter:blur(6px);cursor:pointer;z-index:2}
#viewerCap{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);text-align:center;font-size:14px;color:rgba(255,255,255,.85);padding:0 24px;pointer-events:none;text-shadow:0 1px 8px #000}
</style>
</head>
<body>
<div id="app">
  <div id="stars"></div>
  <div id="viewport">
    <div id="world">
      <svg id="edges" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="nodes"></div>
    </div>
  </div>
  <div id="topbar"><button id="worldBtn"></button><button id="tidyBtn">整理</button><button id="undoBtn" style="display:none">元に戻す</button></div>
  <div id="mergeBar"></div>
  <div id="edgeBar"><span id="edgeBarText"></span><button id="edgeDelBtn">線を削除</button></div>
</div>

<div id="sheetWrap">
  <div id="sheetBg"></div>
  <div id="sheet">
    <div id="handle"></div>
    <div id="sheetImgWrap"><img id="sheetImgPreview" alt=""><button id="sheetImgDel" title="画像を外す">✕</button></div>
    <textarea id="sheetText" placeholder="メモ" lang="ja" autocorrect="on" autocapitalize="none" spellcheck="false"></textarea>
    <div id="colorRow">
      <button class="cdot" data-kind="normal" aria-label="通常"></button>
      <button class="cdot" data-kind="origin" aria-label="起点"></button>
      <button class="cdot" data-kind="goal" aria-label="ゴール"></button>
      <button class="cdot" data-kind="merge" aria-label="統合"></button>
      <button class="cdot" data-kind="red" aria-label="赤"></button>
      <button class="cdot" data-kind="violet" aria-label="紫"></button>
      <button class="cdot" data-kind="pink" aria-label="ピンク"></button>
      <button class="cdot" data-kind="blue" aria-label="青"></button>
      <button id="photoBtn" title="写真">🖼</button>
      <button id="delBtn" title="削除">🗑</button>
    </div>
    <input type="file" id="photoInput" accept="image/*" style="display:none">
  </div>
</div>

<div id="viewer">
  <img id="viewerImg" alt="">
  <div id="viewerCap"></div>
  <button id="viewerEdit">編集</button>
</div>

<div id="worldSheet">
  <div id="worldSheetBg"></div>
  <div id="worldPanel">
    <div id="worldList"></div>
    <button id="newWorld">＋ ワールド</button>
  </div>
</div>

<script>
"use strict";
var LS_KEY = "hasso-memo-world-v1";
var KIND_COLOR = { normal:"#e8e8e8", origin:"#ffd34d", goal:"#54d8ff", merge:"#3ddc84", red:"#ff5f57", violet:"#a78bfa", pink:"#ff6ee7", blue:"#4f7cff" };
var LINE_COLOR = { normal:"#93a1c4", origin:"#ffd34d", goal:"#54d8ff", merge:"#3ddc84", red:"#ff5f57", violet:"#a78bfa", pink:"#ff6ee7", blue:"#4f7cff" };
var SEED = {"worlds":[{"name":"発想","nodes":[{"id":1,"kind":"origin","text":"ドーパミン快感","x":626.448,"y":1219.193},{"id":2,"kind":"origin","text":"物理","x":352.937,"y":1373.678},{"id":3,"kind":"origin","text":"操作感","x":453.983,"y":1285.683},{"id":4,"kind":"origin","text":"平成回帰","x":369.579,"y":1469.760}],"edges":[{"from":2,"to":3},{"from":3,"to":1},{"from":4,"to":2}]},{"name":"オシポンテ","nodes":[{"id":1,"kind":"origin","text":"オシポンテ：住所非公開で、ファンの手紙を推しへ届ける仲介サービス","x":0,"y":0},{"id":2,"kind":"normal","text":"現状の強み：運営が検品して届けるから、推しが安心して受け取れる。SNSで埋もれる想いが、手元に届く手紙になる","x":380,"y":0},{"id":3,"kind":"normal","text":"弱点：事務所に送れる推しには代替品止まり。本当に効くのは、受け取り窓口がない個人勢・クリエイター","x":760,"y":0},{"id":4,"kind":"normal","text":"土台を作る：届く→読まれる→記録に残る→貯まっていく体験にする","x":1140,"y":0},{"id":5,"kind":"normal","text":"決定打の商品を載せる：事務所への郵送では作れない形にする","x":1520,"y":0},{"id":6,"kind":"normal","text":"既読の明確化：QR／ワンタップで「読まれた」が分かる。ありがとうスタンプまで1タップで","x":980,"y":320},{"id":7,"kind":"normal","text":"愛情の数値化：通数・継続月数を可視化。金額だけで競わせない","x":1300,"y":320},{"id":8,"kind":"normal","text":"送付履歴の視覚化：いつ・何の記念日に送ったかが貯まる、思い出のアーカイブにする","x":1620,"y":320},{"id":9,"kind":"normal","text":"返信確定プラン：推しが枠・価格・形式を決める限定プラン。累計額は購入権の条件にする","x":760,"y":600},{"id":10,"kind":"normal","text":"記念日レターブック：ファンみんなの手紙を一冊に束ねて、誕生日・記念日に当日着で届ける","x":1180,"y":-320},{"id":11,"kind":"normal","text":"推しテーマ×読み上げ配信：推しがお題を出す→手紙が集まる→配信で読む。フルはFC、切り抜きはYouTube・インスタへ","x":1500,"y":-320},{"id":12,"kind":"normal","text":"季節の共同作品：七夕は短冊を買って送る→運営が笹に飾り付けて推しへ。量がそのまま絵になる","x":1820,"y":-320},{"id":13,"kind":"normal","text":"交換日記：回数・期間を決めたコース制の往復。完結したノートがファンの手元に残る最上位アイテム","x":2140,"y":-320},{"id":14,"kind":"normal","text":"継続サポーターID：個人情報なしで「今回で○通目」が推しに伝わる表紙シート。推しに覚えられる","x":1940,"y":320},{"id":15,"kind":"merge","text":"循環が生まれる：手紙→配信→切り抜き拡散→新規ファン→次の手紙。推し自身が宣伝する流れ","x":2320,"y":0},{"id":16,"kind":"goal","text":"ゴール：手紙が推しの次の配信になる。お便り番組のフォーマットと運営を担う存在になる","x":2700,"y":0}],"edges":[{"from":1,"to":2},{"from":2,"to":3},{"from":3,"to":4},{"from":4,"to":5},{"from":4,"to":6},{"from":4,"to":7},{"from":4,"to":8},{"from":6,"to":9},{"from":5,"to":10},{"from":5,"to":11},{"from":5,"to":12},{"from":5,"to":13},{"from":5,"to":14},{"from":10,"to":15},{"from":11,"to":15},{"from":12,"to":15},{"from":13,"to":15},{"from":15,"to":16}]}]};

var uidCounter = 1;
function uid(){ return Date.now().toString(36) + "-" + (uidCounter++).toString(36) + Math.floor(Math.random()*1e6).toString(36); }

function buildWorld(w){
  var idMap = {};
  var nodes = w.nodes.map(function(n){ var nid = uid(); idMap[n.id]=nid; return {id:nid, kind:n.kind, text:n.text, x:n.x, y:n.y, anchor:null}; });
  var edges = w.edges.map(function(e){
    var from = nodes.filter(function(n){return n.id===idMap[e.from];})[0];
    var to = nodes.filter(function(n){return n.id===idMap[e.to];})[0];
    var ed = {id:uid(), from:from.id, to:to.id, anchor:null};
    return ed;
  });
  return {id:uid(), name:w.name, nodes:nodes, edges:edges};
}
function seedState(){
  var worlds = SEED.worlds.map(buildWorld);
  return { worlds:worlds, currentId:worlds[0].id, seeded:true, oshaponteV1:true };
}
function load(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(raw){ var s = JSON.parse(raw); if(s && s.worlds && s.worlds.length){
      if(!s.oshaponteV1){
        var exists = s.worlds.some(function(w){ return w.name === "オシポンテ"; });
        if(!exists){
          var seedWorld = null;
          SEED.worlds.forEach(function(w){ if(w.name === "オシポンテ") seedWorld = w; });
          if(seedWorld) s.worlds.push(buildWorld(seedWorld));
        }
        s.oshaponteV1 = true;
        try{ localStorage.setItem(LS_KEY, JSON.stringify(s)); }catch(e){}
      }
      return s;
    } }
  }catch(e){}
  var s2 = seedState(); save(s2); return s2;
}
function save(s){ try{ localStorage.setItem(LS_KEY, JSON.stringify(s || state)); return true; }catch(e){ return false; } }
function saveOrWarn(){ if(!save()) alert("保存できませんでした（容量不足の可能性があります）"); }

var state = load();
var view = { x:0, y:0, scale:1 };
var sizes = {}; // nodeId -> {w,h}
var selectedId = null;
var selectedEdgeId = null;
var candidates = {}; // merge candidate ids
var tempPath = null; // {fromId, x, y}

function cur(){ return state.worlds.filter(function(w){return w.id===state.currentId;})[0] || state.worlds[0]; }
function nodeById(id){ var w=cur(); return w ? w.nodes.filter(function(n){return n.id===id;})[0] : null; }
function sizeOf(n){ return sizes[n.id] || { w:150, h:64 }; }

/* ---------- geometry ---------- */
function borderPoint(n, tx, ty){
  var s = sizeOf(n), hw = s.w/2, hh = s.h/2;
  var dx = tx - n.x, dy = ty - n.y;
  if(dx===0 && dy===0) dx = 1;
  var t = Infinity;
  if(dx!==0) t = Math.min(t, hw/Math.abs(dx));
  if(dy!==0) t = Math.min(t, hh/Math.abs(dy));
  return { x:n.x + dx*t, y:n.y + dy*t };
}
function anchorPoint(n, a){
  // a = {dx,dy} perimeter position stored relative to node: point = center + (dx*hw, dy*hh) with max(|dx|,|dy|)=1
  var s = sizeOf(n);
  return { x:n.x + a.dx*(s.w/2), y:n.y + a.dy*(s.h/2) };
}
function makeAnchor(fromNode, startPt){
  var s = sizeOf(fromNode);
  var dx = (startPt.x - fromNode.x)/(s.w/2), dy = (startPt.y - fromNode.y)/(s.h/2);
  var m = Math.max(Math.abs(dx), Math.abs(dy)) || 1;
  return { dx:dx/m, dy:dy/m };
}
function rectOf(n){ var s=sizeOf(n); return { l:n.x-s.w/2, r:n.x+s.w/2, t:n.y-s.h/2, b:n.y+s.h/2 }; }
function segHitsRect(p1, p2, r, pad){
  // sample-based test, good enough for routing hints
  for(var i=1;i<10;i++){
    var t=i/10, x=p1.x+(p2.x-p1.x)*t, y=p1.y+(p2.y-p1.y)*t;
    if(x>r.l-pad && x<r.r+pad && y>r.t-pad && y<r.b+pad) return true;
  }
  return false;
}
function smoothPath(pts){
  if(pts.length<3) return "M "+pts[0].x+" "+pts[0].y+" L "+pts[pts.length-1].x+" "+pts[pts.length-1].y;
  var d = "M "+pts[0].x+" "+pts[0].y;
  for(var i=0;i<pts.length-1;i++){
    var p0 = pts[Math.max(0,i-1)], p1 = pts[i], p2 = pts[i+1], p3 = pts[Math.min(pts.length-1,i+2)];
    var c1x = p1.x + (p2.x-p0.x)/6, c1y = p1.y + (p2.y-p0.y)/6;
    var c2x = p2.x - (p3.x-p1.x)/6, c2y = p2.y - (p3.y-p1.y)/6;
    d += " C "+c1x.toFixed(1)+" "+c1y.toFixed(1)+", "+c2x.toFixed(1)+" "+c2y.toFixed(1)+", "+p2.x.toFixed(1)+" "+p2.y.toFixed(1);
  }
  return d;
}
function sideNormal(n, pt){
  // outward unit normal of the side of n that pt lies on
  var s = sizeOf(n);
  var dx = (pt.x - n.x)/Math.max(1,(s.w/2)), dy = (pt.y - n.y)/Math.max(1,(s.h/2));
  if(Math.abs(dx) >= Math.abs(dy)) return { x:dx>=0?1:-1, y:0 };
  return { x:0, y:dy>=0?1:-1 };
}
function cubicPt(p0, c1, c2, p1, t){
  var u = 1-t;
  return {
    x:u*u*u*p0.x + 3*u*u*t*c1.x + 3*u*t*t*c2.x + t*t*t*p1.x,
    y:u*u*u*p0.y + 3*u*u*t*c1.y + 3*u*t*t*c2.y + t*t*t*p1.y
  };
}
function edgeGeom(e){
  var a = nodeById(e.from), b = nodeById(e.to);
  if(!a || !b) return null;
  if(!e.anchor){ var bp0 = borderPoint(a, b.x, b.y); e.anchor = makeAnchor(a, bp0); }
  var start = anchorPoint(a, e.anchor);
  var end = borderPoint(b, start.x, start.y);
  var dist = Math.hypot(end.x-start.x, end.y-start.y) || 1;
  var reach = Math.min(150, Math.max(38, dist*0.36));
  // leave the source card and enter the target card perpendicular to their
  // sides, so every line reads as a deliberate connector instead of a
  // diagonal slash, and lines arriving from different directions land on
  // different sides of the target card.
  var sn = sideNormal(a, start), en = sideNormal(b, end);
  var c1 = { x:start.x + sn.x*reach, y:start.y + sn.y*reach };
  var c2 = { x:end.x + en.x*reach, y:end.y + en.y*reach };
  // avoid intermediate memo bodies: sample the curve; if it crosses another
  // card, push both control points perpendicular, away from that card.
  var w = cur();
  var ux = (end.x-start.x)/dist, uy = (end.y-start.y)/dist;
  for(var k=0;k<w.nodes.length;k++){
    var n = w.nodes[k];
    if(n.id===a.id || n.id===b.id) continue;
    var r = rectOf(n), hit = false;
    for(var i=3;i<=17 && !hit;i++){
      var p = cubicPt(start, c1, c2, end, i/20);
      if(p.x>r.l-16 && p.x<r.r+16 && p.y>r.t-16 && p.y<r.b+16) hit = true;
    }
    if(hit){
      var mid = cubicPt(start, c1, c2, end, 0.5);
      var side = ((mid.x - n.x) * (-uy) + (mid.y - n.y) * ux) >= 0 ? 1 : -1;
      var push = Math.max(sizeOf(n).w, sizeOf(n).h)/2 + 52;
      c1 = { x:c1.x - uy*push*side, y:c1.y + ux*push*side };
      c2 = { x:c2.x - uy*push*side, y:c2.y + ux*push*side };
    }
  }
  var d = "M "+start.x.toFixed(1)+" "+start.y.toFixed(1)+
          " C "+c1.x.toFixed(1)+" "+c1.y.toFixed(1)+", "+c2.x.toFixed(1)+" "+c2.y.toFixed(1)+", "+end.x.toFixed(1)+" "+end.y.toFixed(1);
  return { d:d, end:end, start:start };
}

function snippet(t, len){

  refreshUndoBtn();
  // focus state: selected node -> only its lines & neighbours stay bright;
  // selected edge -> only that line and its two memos stay bright.
  var focusNodes = null, focusEdges = null;
  if(selectedEdgeId){
    var se = null;
    w.edges.forEach(function(x){ if(x.id===selectedEdgeId) se = x; });
    if(se){ focusNodes = {}; focusNodes[se.from]=true; focusNodes[se.to]=true; focusEdges = {}; focusEdges[se.id]=true; }
    else selectedEdgeId = null;
  }
  if(!focusEdges && selectedId && nodeById(selectedId)){
    focusNodes = {}; focusNodes[selectedId]=true; focusEdges = {};
    w.edges.forEach(function(x){
      if(x.from===selectedId || x.to===selectedId){ focusEdges[x.id]=true; focusNodes[x.from]=true; focusNodes[x.to]=true; }
    });
  }
  nodesEl.innerHTML = "";
  w.nodes.forEach(function(n){
    var el = document.createElement("div");
    var cls = "node" + (n.img ? " imgnode" : "") + (n.id===selectedId ? " selected" : "") + (candidates[n.id] ? " candidate" : "");
    if(focusNodes){ cls += focusNodes[n.id] ? (n.id!==selectedId ? " neighbor" : "") : " dim"; }
    el.className = cls;
    el.dataset.kind = n.kind; el.dataset.id = n.id;
    el.style.left = n.x+"px"; el.style.top = n.y+"px";
    if(n.img){

      im.onload = function(){

      '<stop offset="0" stop-color="'+LINE_COLOR[a.kind]+'"/>'+
      '<stop offset="1" stop-color="'+LINE_COLOR[b.kind]+'"/></linearGradient></defs>';
    html += '<path class="edge-glow'+stateCls+'" data-edge="'+e.id+'" stroke="url(#'+gid+')" d="'+g.d+'"/>';
    html += '<path class="edge-main'+stateCls+'" data-edge="'+e.id+'" stroke="url(#'+gid+')" d="'+g.d+'"/>';

  });

function e_startFor(a, tx, ty){

function toWorld(sx, sy){
  var r = viewport.getBoundingClientRect();
  return { x:(sx - r.left - view.x)/view.scale, y:(sy - r.top - view.y)/view.scale };
}
function fitWorld(){
  var w = cur(); if(!w || !w.nodes.length) { view={x:0,y:0,scale:1}; render(); return; }
  var minX=1e18,maxX=-1e18,minY=1e18,maxY=-1e18;
  w.nodes.forEach(function(n){ var s=sizeOf(n); minX=Math.min(minX,n.x-s.w/2); maxX=Math.max(maxX,n.x+s.w/2); minY=Math.min(minY,n.y-s.h/2); maxY=Math.max(maxY,n.y+s.h/2); });
  var vw = viewport.clientWidth, vh = viewport.clientHeight, pad = 42;
  var sc = Math.min((vw-pad*2)/Math.max(1,(maxX-minX)), (vh-pad*2)/Math.max(1,(maxY-minY)), 1.4);
  view.scale = sc;
  view.x = vw/2 - (minX+maxX)/2*sc;
  view.y = vh/2 - (minY+maxY)/2*sc;
  render();
}

/* ---------- tidy (de-overlap, layout-preserving) ---------- */
var LS_UNDO = LS_KEY + ":undo";
function loadUndo(){ try{ return JSON.parse(localStorage.getItem(LS_UNDO) || "null"); }catch(e){ return null; } }
function refreshUndoBtn(){
  if(!undoBtn) return;
  var u = loadUndo(), w = cur();
  undoBtn.style.display = (u && w && u.worldId === w.id) ? "" : "none";
}
function anchorT(a){
  // perimeter position of an anchor, 0..4 clockwise from the top-right corner
  if(a.dx >= 0.999) return (a.dy + 1) / 2;
  if(a.dy >= 0.999) return 1 + (1 - a.dx) / 2;
  if(a.dx <= -0.999) return 2 + (1 - a.dy) / 2;
  return 3 + (a.dx + 1) / 2;
}
function anchorFromT(t){
  t = ((t % 4) + 4) % 4;
  if(t < 1) return { dx:1, dy:2 * t - 1 };
  if(t < 2) return { dx:3 - 2 * t, dy:1 };
  if(t < 3) return { dx:-1, dy:5 - 2 * t };
  return { dx:2 * t - 7, dy:-1 };
}
function reanchor(w){
  // Re-assign every line's exit point on its source memo so it faces the
  // target memo (anchors used to stay frozen at their creation spot, so
  // after memos moved, lines left from the far side and wrapped around,
  // crossing others). Exits sharing one memo are spread around its frame
  // in direction order so they do not tangle at the card.
  var byNode = {};
  w.edges.forEach(function(e){
    var a = nodeById(e.from), b = nodeById(e.to);
    if(!a || !b) return;
    var anc = makeAnchor(a, borderPoint(a, b.x, b.y));
    (byNode[e.from] = byNode[e.from] || []).push({ e:e, t:anchorT(anc) });
  });
  Object.keys(byNode).forEach(function(nid){
    var list = byNode[nid].sort(function(p, q){ return p.t - q.t; });
    if(list.length > 1){
      var GAP = 0.34;
      for(var i = 1; i < list.length; i++) list[i].t = Math.max(list[i].t, list[i - 1].t + GAP);
      var span = list[list.length - 1].t - list[0].t;
      if(span > 3.7){
        var t0 = list[0].t, f = 3.7 / span;
        list.forEach(function(it){ it.t = t0 + (it.t - t0) * f; });
      }
    }
    list.forEach(function(it){ it.e.anchor = anchorFromT(it.t); });
  });
}
function tidyLayout(){
  var w = cur(); if(!w || w.nodes.length < 2) return;
  var pos = {};
  w.nodes.forEach(function(n){ pos[n.id] = { x:n.x, y:n.y }; });
  var anchors = {};
  w.edges.forEach(function(e){ anchors[e.id] = e.anchor ? { dx:e.anchor.dx, dy:e.anchor.dy } : null; });
  try{ localStorage.setItem(LS_UNDO, JSON.stringify({ worldId:w.id, pos:pos, anchors:anchors })); }catch(e){}
  var PAD = 26, ns = w.nodes;
  for(var iter = 0; iter < 240; iter++){
    var moved = false;
    for(var i = 0; i < ns.length; i++){
      for(var j = i + 1; j < ns.length; j++){
        var a = ns[i], b = ns[j], sa = sizeOf(a), sb = sizeOf(b);
        var dx = b.x - a.x, dy = b.y - a.y;
        var ox = (sa.w + sb.w) / 2 + PAD - Math.abs(dx);
        var oy = (sa.h + sb.h) / 2 + PAD - Math.abs(dy);
        if(ox > 0 && oy > 0){
          moved = true;
          if(ox < oy){ var px = ox / 2 + 0.5, sx = dx >= 0 ? 1 : -1; a.x -= px * sx; b.x += px * sx; }
          else { var py = oy / 2 + 0.5, sy = dy >= 0 ? 1 : -1; a.y -= py * sy; b.y += py * sy; }
        }
      }
    }
    if(!moved) break;
  }
  reanchor(w);
  selectedId = null; selectedEdgeId = null;
  saveOrWarn();
  fitWorld();
  refreshUndoBtn();
}
function undoTidy(){
  var u = loadUndo(), w = cur();
  if(!u || !w || u.worldId !== w.id) return;
  w.nodes.forEach(function(n){ var p = u.pos[n.id]; if(p){ n.x = p.x; n.y = p.y; } });
  if(u.anchors) w.edges.forEach(function(e){ if(e.id in u.anchors){ var an = u.anchors[e.id]; e.anchor = an ? { dx:an.dx, dy:an.dy } : null; } });
  try{ localStorage.removeItem(LS_UNDO); }catch(e){}
  saveOrWarn();
  fitWorld();
  refreshUndoBtn();
}
tidyBtn.addEventListener("click", tidyLayout);
undoBtn.addEventListener("click", undoTidy);

/* ---------- mutations ---------- */
function addEdge(fromId, toId){
  var w = cur();
  if(fromId===toId) return null;
  var exists = w.edges.some(function(e){return e.from===fromId && e.to===toId;});
  if(exists) return null;
  var a = nodeById(fromId), b = nodeById(toId);
  var bp = borderPoint(a, b.x, b.y);
  var e = { id:uid(), from:fromId, to:toId, anchor:makeAnchor(a, bp) };
  w.edges.push(e); return e;
}
function addNode(text, kind, x, y, img){
  var w = cur();
  var n = { id:uid(), kind:kind||"normal", text:text, x:x, y:y };
  if(img) n.img = img;
  w.nodes.push(n); return n;
}

/* ---------- image import (downscale + compress to dataURL) ---------- */
function processImageFile(file, cb){
  if(!file || !/^image\//.test(file.type||"")) return;
  var url = URL.createObjectURL(file);
  var im = new Image();
  im.onload = function(){
    try{
      var MAX = 1024;
      var iw = im.naturalWidth || im.width, ih = im.naturalHeight || im.height;
      var sc = Math.min(1, MAX/Math.max(iw, ih));
      var cw = Math.max(1, Math.round(iw*sc)), ch = Math.max(1, Math.round(ih*sc));
      var cv = document.createElement("canvas"); cv.width = cw; cv.height = ch;
      cv.getContext("2d").drawImage(im, 0, 0, cw, ch);
      URL.revokeObjectURL(url);
      var data = "";
      try{ data = cv.toDataURL("image/webp", 0.82); }catch(e){}
      if(!data || data.indexOf("data:image/webp")!==0) data = cv.toDataURL("image/jpeg", 0.82);
      cb(data);
    }catch(e){ URL.revokeObjectURL(url); }
  };
  im.onerror = function(){ URL.revokeObjectURL(url); };
  im.src = url;
}
function deleteNode(id){
  var w = cur();
  w.nodes = w.nodes.filter(function(n){return n.id!==id;});
  w.edges = w.edges.filter(function(e){return e.from!==id && e.to!==id;});
  if(selectedId===id) selectedId = null;
  delete candidates[id];
}

});
document.addEventListener("paste", function(ev){
  var items = (ev.clipboardData && ev.clipboardData.items) || [];
  for(var i=0;i<items.length;i++){
    if(items[i].type && items[i].type.indexOf("image/")===0){
      var f = items[i].getAsFile(); if(!f) continue;
      ev.preventDefault();
      processImageFile(f, function(data){
        if(!data) return;
        if(sheetCtx){ sheetCtx.img = data; updateSheetImg(); }
        else {
          var c = toWorld(window.innerWidth/2, window.innerHeight/2);

function closeSheet(commit){
  if(!sheetCtx){ sheetWrap.style.display="none"; return; }
  var ctx = sheetCtx; sheetCtx = null;
  if(commit){
    var text = sheetText.value.trim();
    if(ctx.mode==="edit"){
      var n = nodeById(ctx.nodeId);
      if(n){
        if(text || ctx.img || ctx.hadImg){ n.text = text; n.kind = ctx.kind; if(ctx.img) n.img = ctx.img; else delete n.img; }
      }
    } else if(text || ctx.img){
      var nn = addNode(text, ctx.kind, ctx.x, ctx.y, ctx.img);
      (ctx.connectFrom||[]).forEach(function(fid){ addEdge(fid, nn.id); });
      (ctx.mergeFrom||[]).forEach(function(fid){ if(fid!==nn.id) addEdge(fid, nn.id); });

    }

  if(sheetCtx && sheetCtx.mode==="edit"){ var id = sheetCtx.nodeId; sheetCtx=null; deleteNode(id); save(); sheetWrap.style.display="none"; render(); }
});
document.getElementById("sheetBg").addEventListener("click", function(){ closeSheet(true); });
// swipe-down to close
(function(){
  var sy=null, dy=0, st=0;
  sheetEl.addEventListener("pointerdown", function(ev){
    // swipe-down starts only from the sheet's own chrome (handle / padding).
    // Never hijack touches on the textarea or any interactive child: on iOS
    // the old sheet-wide setPointerCapture + touch-action:none around the
    // input could disturb the native IME candidate UI.
    if(imeComposing) return;
    if(ev.target!==sheetEl && ev.target!==document.getElementById("handle")) return;
    sy = ev.clientY; dy = 0; st = Date.now();
    sheetEl.style.transition = "none";
    sheetEl.setPointerCapture(ev.pointerId);
  });
  sheetEl.addEventListener("pointermove", function(ev){
    if(sy===null) return;
    dy = Math.max(0, ev.clientY - sy);
    sheetEl.style.transform = "translateY("+dy+"px)";
  });
  sheetEl.addEventListener("pointerup", function(ev){
    if(sy===null) return;
    var dt = Date.now()-st, vel = dy/Math.max(1,dt);
    var shouldClose = dy>90 || (dy>28 && vel>0.55);
    sy = null;
    if(shouldClose){ sheetEl.style.transform=""; closeSheet(true); }
    else { sheetEl.style.transition="transform .2s ease"; sheetEl.style.transform="translateY(0)"; }
  });
  sheetEl.addEventListener("pointercancel", function(){ sy=null; sheetEl.style.transform="translateY(0)"; });
})();

/* ---------- image viewer ---------- */
var viewerEl = document.getElementById("viewer");
var viewerImg = document.getElementById("viewerImg");
var viewerCap = document.getElementById("viewerCap");
var viewerEditBtn = document.getElementById("viewerEdit");
var viewerNodeId = null;
var vScale = 1, vX = 0, vY = 0;
function applyViewerTransform(){
  viewerImg.style.transform = "translate(calc(-50% + "+vX+"px), calc(-50% + "+vY+"px)) scale("+vScale+")";
}
function openViewer(nodeId){
  var n = nodeById(nodeId);
  if(!n || !n.img) return;
  viewerNodeId = nodeId;
  vScale = 1; vX = 0; vY = 0;
  viewerImg.src = n.img;
  viewerCap.textContent = n.text || "";
  viewerCap.style.display = n.text ? "block" : "none";
  applyViewerTransform();
  viewerEl.style.display = "block";
}
function closeViewer(){
  viewerNodeId = null;
  viewerEl.style.display = "none";
  viewerImg.removeAttribute("src");
}
viewerEditBtn.addEventListener("click", function(ev){
  ev.stopPropagation();
  var id = viewerNodeId;
  var n = id ? nodeById(id) : null;
  closeViewer();
  if(n) openSheet({ mode:"edit", nodeId:n.id, text:n.text, kind:n.kind, img:n.img, hadImg:!!n.img });
});
(function(){
  var ptrs = {}, pinch = null, drag = null, downInfo = null;
  viewerEl.addEventListener("pointerdown", function(ev){
    if(ev.target===viewerEditBtn) return;
    ptrs[ev.pointerId] = { x:ev.clientX, y:ev.clientY };
    if(Object.keys(ptrs).length===2){
      var ps = Object.values(ptrs);
      pinch = { d0:Math.hypot(ps[0].x-ps[1].x, ps[0].y-ps[1].y), s0:vScale };
      drag = null; downInfo = null;
      return;
    }
    drag = { sx:ev.clientX, sy:ev.clientY, vx:vX, vy:vY, moved:false };
    downInfo = { y:ev.clientY, t:Date.now() };
  });
  viewerEl.addEventListener("pointermove", function(ev){
    if(ptrs[ev.pointerId]) ptrs[ev.pointerId] = { x:ev.clientX, y:ev.clientY };
    if(pinch){
      var ps = Object.values(ptrs); if(ps.length<2) return;
      var d = Math.hypot(ps[0].x-ps[1].x, ps[0].y-ps[1].y);
      vScale = Math.min(5, Math.max(1, pinch.s0 * (d/Math.max(20,pinch.d0))));
      if(vScale===1){ vX = 0; vY = 0; }
      applyViewerTransform(); return;
    }
    if(drag){
      var dx = ev.clientX-drag.sx, dy = ev.clientY-drag.sy;
      if(Math.abs(dx)+Math.abs(dy)>6) drag.moved = true;
      if(drag.moved && vScale>1){ vX = drag.vx+dx; vY = drag.vy+dy; applyViewerTransform(); }
    }
  });
  function vEnd(ev){
    var wasPinch = !!pinch;
    delete ptrs[ev.pointerId];
    if(pinch && Object.keys(ptrs).length<2) pinch = null;
    if(wasPinch){ drag = null; downInfo = null; return; }
    if(!drag) return;
    var d = drag, di = downInfo; drag = null; downInfo = null;
    if(vScale>1) return;
    var dy = ev.clientY - d.sy;
    // swipe down to close
    if(dy>70){ closeViewer(); return; }
    // plain tap on background/image (not a drag) closes
    if(!d.moved && di && Date.now()-di.t<400){ closeViewer(); }
  }
  viewerEl.addEventListener("pointerup", vEnd);
  viewerEl.addEventListener("pointercancel", function(ev){ delete ptrs[ev.pointerId]; pinch=null; drag=null; downInfo=null; });
})();

/* ---------- world sheet ---------- */
var worldSheet = document.getElementById("worldSheet");
function openWorlds(){
  var list = document.getElementById("worldList"); list.innerHTML = "";
  state.worlds.forEach(function(w){
    var row = document.createElement("div"); row.className="wrow";
    var name = document.createElement("span"); name.textContent = (w.id===state.currentId?"● ":"")+w.name;
    var cnt = document.createElement("span"); cnt.className="cnt"; cnt.textContent = w.nodes.length+"件";
    var ren = document.createElement("button"); ren.className="wact"; ren.textContent="✎";
    ren.addEventListener("click", function(ev){ ev.stopPropagation(); var nv = prompt("ワールド名", w.name); if(nv && nv.trim()){ w.name = nv.trim(); save(); openWorlds(); render(); } });
    var del = document.createElement("button"); del.className="wact"; del.textContent="🗑";
    del.addEventListener("click", function(ev){ ev.stopPropagation(); if(state.worlds.length<=1){ alert("最後のワールドは削除できません"); return; } if(confirm("ワールド「"+w.name+"」を削除しますか？")){ state.worlds = state.worlds.filter(function(x){return x.id!==w.id;}); if(state.currentId===w.id) state.currentId = state.worlds[0].id; selectedId=null; candidates={}; save(); openWorlds(); render(); } });
    row.appendChild(name); row.appendChild(cnt); row.appendChild(ren); row.appendChild(del);
    row.addEventListener("click", function(){ state.currentId = w.id; selectedId=null; candidates={}; save(); worldSheet.style.display="none"; render(); fitWorld(); });
    list.appendChild(row);
  });
  worldSheet.style.display = "block";
}
worldBtn.addEventListener("click", openWorlds);
document.getElementById("worldSheetBg").addEventListener("click", function(){ worldSheet.style.display="none"; render(); });
document.getElementById("newWorld").addEventListener("click", function(){
  var nv = prompt("新しいワールド名", "");
  if(nv===null) return;
  var w = { id:uid(), name:nv.trim()||"ワールド", nodes:[], edges:[] };
  state.worlds.push(w); state.currentId = w.id; selectedId=null; candidates={};
  save(); worldSheet.style.display="none"; view={x:0,y:0,scale:1}; render();
});

/* ---------- gestures ---------- */
var pointers = {};
var gesture = null; // {type:'pan'|'node'|'port', ...}
var lastTap = { t:0, x:0, y:0, nodeId:null };
var longTimer = null;

function nodeElFromEvent(ev){
  var el = ev.target;
  while(el && el!==viewport){ if(el.classList && el.classList.contains("node")) return el; el = el.parentNode; }
  return null;
}
function clearLong(){ if(longTimer){ clearTimeout(longTimer); longTimer=null; } }

viewport.addEventListener("pointerdown", function(ev){
  pointers[ev.pointerId] = { x:ev.clientX, y:ev.clientY };
  if(Object.keys(pointers).length===2){
    var ps = Object.values(pointers);
    gesture = { type:"pinch", d0:Math.hypot(ps[0].x-ps[1].x, ps[0].y-ps[1].y), scale0:view.scale, cx:(ps[0].x+ps[1].x)/2, cy:(ps[0].y+ps[1].y)/2, vx:view.x, vy:view.y };
    clearLong(); return;
  }
  var portEl = ev.target && ev.target.classList && ev.target.classList.contains("port") ? ev.target : null;
  var nEl = nodeElFromEvent(ev);
  var wp = toWorld(ev.clientX, ev.clientY);
  var edgeId = (!portEl && !nEl && ev.target && ev.target.dataset) ? ev.target.dataset.edge : null;
  if(edgeId){
    gesture = { type:"edge", id:edgeId, sx:ev.clientX, sy:ev.clientY, vx:view.x, vy:view.y, moved:false };
    return;
  }
  if(portEl){
    var fid = portEl.dataset.port;
    gesture = { type:"port", fromId:fid, moved:false };
    tempPath = { fromId:fid, x:wp.x, y:wp.y };
    ev.preventDefault(); render(); return;
  }
  if(nEl){
    var nid = nEl.dataset.id;
    var n = nodeById(nid);
    gesture = { type:"node", id:nid, sx:ev.clientX, sy:ev.clientY, ox:n.x, oy:n.y, moved:false, downAt:Date.now() };
    longTimer = setTimeout(function(){
      if(gesture && gesture.type==="node" && !gesture.moved){
        // long-press: toggle merge candidate
        if(candidates[nid]) delete candidates[nid]; else candidates[nid]=true;
        gesture.longFired = true;
        if(navigator.vibrate) navigator.vibrate(15);
        render();
      }
    }, 550);
    ev.preventDefault(); return;
  }
  gesture = { type:"pan", sx:ev.clientX, sy:ev.clientY, vx:view.x, vy:view.y, moved:false, downAt:Date.now(), wp:wp };
});
viewport.addEventListener("pointermove", function(ev){
  if(pointers[ev.pointerId]) pointers[ev.pointerId] = { x:ev.clientX, y:ev.clientY };
  if(!gesture) return;
  if(gesture.type==="pinch"){
    var ps = Object.values(pointers); if(ps.length<2) return;
    var d = Math.hypot(ps[0].x-ps[1].x, ps[0].y-ps[1].y);
    var cx = (ps[0].x+ps[1].x)/2, cy = (ps[0].y+ps[1].y)/2;
    var r = viewport.getBoundingClientRect();
    var ns = Math.min(3, Math.max(0.15, gesture.scale0 * (d/Math.max(20,gesture.d0))));
    // keep world point under initial pinch center stable, plus follow center move
    var wx = (gesture.cx - r.left - gesture.vx)/gesture.scale0, wy = (gesture.cy - r.top - gesture.vy)/gesture.scale0;
    view.scale = ns;
    view.x = (cx - r.left) - wx*ns; view.y = (cy - r.top) - wy*ns;
    applyView(); return;
  }
  if(gesture.type==="pan" || gesture.type==="edge"){
    var dx = ev.clientX-gesture.sx, dy = ev.clientY-gesture.sy;
    if(Math.abs(dx)+Math.abs(dy)>6) gesture.moved = true;
    if(gesture.moved){ view.x = gesture.vx+dx; view.y = gesture.vy+dy; applyView(); }
    return;
  }
  if(gesture.type==="node"){
    var dxw = (ev.clientX-gesture.sx)/view.scale, dyw = (ev.clientY-gesture.sy)/view.scale;
    if(Math.abs(ev.clientX-gesture.sx)+Math.abs(ev.clientY-gesture.sy)>7){ gesture.moved = true; clearLong(); }
    if(gesture.moved && !gesture.longFired){
      var n = nodeById(gesture.id); if(!n) return;
      n.x = gesture.ox + dxw; n.y = gesture.oy + dyw;
      render();
      var el = nodesEl.querySelector('[data-id="'+gesture.id+'"]'); if(el) el.classList.add("dragging");
    }
    return;
  }
  if(gesture.type==="port"){
    gesture.moved = true;
    var wp = toWorld(ev.clientX, ev.clientY);
    tempPath = { fromId:gesture.fromId, x:wp.x, y:wp.y };
    render(); return;
  }
});
function endPointer(ev){
  delete pointers[ev.pointerId];
  if(!gesture) return;
  var g = gesture;
  if(Object.keys(pointers).length>0 && g.type!=="pinch"){ /* keep gesture */ }
  if(g.type==="pinch"){ if(Object.keys(pointers).length<2){ gesture=null; save(); } return; }
  gesture = null; clearLong();
  var now = Date.now();
  var wp = toWorld(ev.clientX, ev.clientY);

  if(g.type==="edge"){
    if(g.moved){ save(); return; }
    // tap on a line: focus just that connection (bar above offers delete)
    selectedEdgeId = (selectedEdgeId===g.id) ? null : g.id;
    if(selectedEdgeId) selectedId = null;
    render(); return;
  }
  if(g.type==="port"){
    tempPath = null;
    // dropped on a node?
    var dropEl = document.elementFromPoint(ev.clientX, ev.clientY);
    var nEl = null, t = dropEl;
    while(t && t!==document.body){ if(t.classList && t.classList.contains("node")){ nEl=t; break; } t=t.parentNode; }
    if(nEl && nEl.dataset.id!==g.fromId){
      addEdge(g.fromId, nEl.dataset.id); save(); render(); return;
    }
    if(!nEl){
      // create new node connected from port source
      openSheet({ mode:"new", text:"", kind:"normal", x:wp.x, y:wp.y, connectFrom:[g.fromId] });
      render(); return;
    }
    render(); return;
  }
  if(g.type==="node"){
    var n = nodeById(g.id);
    if(g.longFired){ render(); return; }
    if(g.moved){
      // dropped onto another node -> connect
      var els = nodesEl.querySelectorAll(".node");
      var target = null;
      for(var i=0;i<els.length;i++){
        var o = nodeById(els[i].dataset.id);
        if(!o || o.id===g.id) continue;
        var r = rectOf(o);
        if(n.x>r.l && n.x<r.r && n.y>r.t && n.y<r.b){ target = o; break; }
      }
      if(target){ n.x = g.ox; n.y = g.oy; addEdge(g.id, target.id); }
      save(); render(); return;
    }
    // tap on node
    selectedEdgeId = null;
    var isDouble = (now - lastTap.t < 350) && lastTap.nodeId===g.id;
    lastTap = { t:now, x:ev.clientX, y:ev.clientY, nodeId:g.id };
    if(isDouble){ openSheet({ mode:"edit", nodeId:g.id, text:n.text, kind:n.kind, img:n.img, hadImg:!!n.img }); return; }
    var candIds = Object.keys(candidates);
    if(candIds.length>=1 && !candidates[g.id]){
      // existing memo tapped while merge candidates exist -> it becomes the merge target
      candIds.forEach(function(fid){ if(fid!==g.id) addEdge(fid, g.id); });
      candidates = {}; save(); render(); return;
    }
    if(selectedId && selectedId!==g.id){
      addEdge(selectedId, g.id); selectedId = g.id; save(); render(); return;
    }
    if(n.img && candIds.length===0){
      // normal tap on an image memo: open the full-image viewer instead of the editor.
      // (connection contexts above take priority; the node stays selected so its
      //  port / tap-to-tap flow still works after the viewer is closed)
      selectedId = g.id; render(); openViewer(g.id); return;
    }
    if(selectedId===g.id){ openSheet({ mode:"edit", nodeId:g.id, text:n.text, kind:n.kind, img:n.img, hadImg:!!n.img }); return; }
    selectedId = g.id; render(); return;
  }
  if(g.type==="pan"){
    if(g.moved){ save(); return; }
    // tap on empty space
    var candIds2 = Object.keys(candidates);
    if(candIds2.length>=2){
      openSheet({ mode:"new", text:"", kind:"merge", x:g.wp.x, y:g.wp.y, mergeFrom:candIds2.slice() });
      candidates = {}; render(); return;
    }
    if(candIds2.length===1){ candidates = {}; render(); return; }
    var isDouble2 = (now - lastTap.t < 350) && !lastTap.nodeId && Math.hypot(ev.clientX-lastTap.x, ev.clientY-lastTap.y)<34;
    lastTap = { t:now, x:ev.clientX, y:ev.clientY, nodeId:null };
    if(isDouble2){ selectedId=null; selectedEdgeId=null; openSheet({ mode:"new", text:"", kind:"normal", x:g.wp.x, y:g.wp.y }); return; }
    selectedId = null; selectedEdgeId = null; render(); return;
  }
}
viewport.addEventListener("pointerup", endPointer);
viewport.addEventListener("pointercancel", function(ev){ delete pointers[ev.pointerId]; clearLong(); if(gesture && gesture.type==="port"){ tempPath=null; } gesture=null; render(); });
viewport.addEventListener("wheel", function(ev){
  ev.preventDefault();
  var r = viewport.getBoundingClientRect();
  var mx = ev.clientX-r.left, my = ev.clientY-r.top;
  var wx = (mx-view.x)/view.scale, wy = (my-view.y)/view.scale;
  var ns = Math.min(3, Math.max(0.15, view.scale * (ev.deltaY<0 ? 1.12 : 0.89)));
  view.scale = ns; view.x = mx - wx*ns; view.y = my - wy*ns;
  applyView();
}, { passive:false });
viewport.addEventListener("dblclick", function(ev){ ev.preventDefault(); });


/* ---------- init ---------- */
render();
requestAnimationFrame(function(){ render(); fitWorld(); });
window.addEventListener("resize", function(){
  // iOS fires resize when the keyboard / IME candidate bar opens or changes
  // height. Rebuilding the whole canvas DOM at that moment risks disturbing
  // an in-progress composition, and is pointless while the sheet covers the
  // canvas (closeSheet renders anyway).
  if(imeComposing) return;
  if(sheetWrap.style.display==="block") return;
  render();
});
</script>
</body>
</html>
